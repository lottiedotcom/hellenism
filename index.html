<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Sanctuary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Action Sound -->
  <audio id="action-sound" src="chime.mp3" preload="auto"></audio>

  <nav>
    <button class="nav-btn active" data-target="home-view">Home</button>
    <button class="nav-btn" data-target="moon-view">Moon</button>
    <button class="nav-btn" data-target="altar-view">Altar</button>
    <button class="nav-btn" data-target="tarot-view">Tarot</button>
    <button class="nav-btn" data-target="archive-view">Archive</button>
    <label class="sound-label">
      <input type="checkbox" id="sound-toggle" checked> Sound
    </label>
  </nav>

  <main>
    <!-- Home View -->
    <section id="home-view" class="view active">
      <h1 id="user-greeting">Welcome back (´｡• ᵕ •｡`)</h1>
      
      <div class="panel">
        <h3>Schedule</h3>
        <label>Wake: <input type="time" id="wake-time"></label>
        <label>Sleep: <input type="time" id="sleep-time"></label>
        <button id="save-schedule-btn">Save (^_^)</button>
        <p>Sundown today: <span id="sundown-time">Loading...</span></p>
      </div>

      <div class="panel">
        <h3>Daily Practices</h3>
        <button id="khernips-btn">Wash Hands (0)</button>
        <p id="daily-hymn"></p>
        <div class="kharis-box">
          Kharis Logs: <span id="kharis-count">0</span>
          <button id="kharis-btn">Add Kharis (★ω★)</button>
        </div>
      </div>

      <div class="panel">
        <h3>Libations</h3>
        <div id="libation-list"></div>
        <input type="text" id="new-libation" placeholder="New libation...">
        <button id="add-libation-btn">Add (+)</button>
      </div>

      <div class="panel">
        <h3>Journal</h3>
        <textarea id="journal-entry" placeholder="Thoughts for today..."></textarea>
        <button id="save-journal-btn">Save to Cloud</button>
      </div>
    </section>

    <!-- Moon View -->
    <section id="moon-view" class="view hidden">
      <h2 id="moon-phase-name">Loading...</h2>
      <div class="kaomoji-display" id="moon-phase-kaomoji">🌑</div>
      <p id="moon-keywords"></p>
      <p>Age: <span id="moon-age"></span> | Zodiac: <span id="moon-zodiac"></span></p>
      <p>Illumination: <span id="moon-percentage"></span></p>
      
      <div class="panel">
        <h3>Cycle Progress</h3>
        <div class="progress-bar"><div id="deipnon-progress"></div></div>
        <p>Cycle Completion: <span id="deipnon-percent"></span></p>
        <p>Hekate's Deipnon: <span id="countdown-deipnon"></span></p>
        <p>Noumenia: <span id="countdown-noumenia"></span></p>
        <p>Agathos Daimon: <span id="countdown-agathos"></span></p>
      </div>

      <p class="quote" id="night-quote"></p>
    </section>

    <!-- Altar View (NEW & UPDATED) -->
    <section id="altar-view" class="view hidden">
      <div class="shrine-controls">
        <label>Current Shrine: </label>
        <select id="shrine-selector">
          <option value="Hestia">Hestia</option>
          <option value="Hekate">Hekate</option>
          <option value="Apollo">Apollo</option>
          <option value="Hermes">Hermes</option>
        </select>
        <button id="sweep-altar-btn">Sweep Altar ( ˘▽˘)っ彡</button>
      </div>

      <div class="altar-tools">
        <label class="custom-file-upload">
          <input type="file" id="upload-offering" accept="image/*">
          Add Offering (+)
        </label>
        <label class="custom-file-upload">
          <input type="file" id="upload-sketch" accept="image/*">
          Update Sketch Frame (✎)
        </label>
      </div>

      <!-- Drag and Drop Canvas -->
      <div id="altar-canvas">
        <div id="sketch-frame" class="hidden"></div>
      </div>

      <!-- Petition Journal -->
      <div class="panel petition-panel">
        <h3>Prayer & Petition</h3>
        <div class="petition-controls">
          <button id="petition-prompt-btn">Prompt (O_O)</button>
        </div>
        <div class="petition-wrapper">
          <textarea id="petition-text" placeholder="Write your petition here..."></textarea>
          <div id="sparkle-container"></div>
        </div>
        <button id="petition-send-btn">Send to the Gods (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧</button>
      </div>
    </section>

    <!-- Tarot View -->
    <section id="tarot-view" class="view hidden">
      <button id="draw-card-btn">Draw a Card (✧ω✧)</button>
      <div id="card-display" class="hidden panel">
        <h3 id="card-name"></h3>
        <p id="card-meaning"></p>
      </div>
    </section>

    <!-- Archive View -->
    <section id="archive-view" class="view hidden">
      <div class="panel">
        <h3>Add Deity</h3>
        <input type="text" id="card-name-input" placeholder="Name">
        <input type="text" id="card-epithet-input" placeholder="Epithets">
        <input type="text" id="card-offerings-input" placeholder="Offerings">
        <button id="save-card-btn">Save Card</button>
      </div>
      <div id="archive-grid"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
